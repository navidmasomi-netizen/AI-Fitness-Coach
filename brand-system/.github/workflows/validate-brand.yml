name: Validate brand assets

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow pypdf
      - run: sudo apt-get update && sudo apt-get install -y inkscape imagemagick
      - run: python scripts/build_release_assets.py
      - run: python scripts/validate_brand_assets.py
